<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" width="100%" role="img">
<title>AI-Native SDLC governed pipeline</title>
<desc>PRD pipeline to governed dev to QA pipeline, with confirmation gates and a feedback loop, running on the WorkBuddy skill runtime.</desc>
