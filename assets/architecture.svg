<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" role="img">
<title>AI-Native SDLC multi-agent governed pipeline</title>
<desc>AI SDLC Master orchestrates PRD to governed dev to QA pipeline as a hierarchical multi-agent system, with persistent project memory (state.json) and confirmation gates.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="30" font-size="14" font-weight="500" fill="#1a2b4a">AI-Native SDLC · 多 Agent 受治理交付流水线</text>
<text x="40" y="50" font-size="12" fill="#5b6b85">顶层编排器调度 PRD → Dev → QA · 文件化交接 · 确认闸门 · 反漂移</text>

<!-- Master orchestrator -->
<rect x="190" y="70" width="300" height="48" rx="12" fill="#EDE9FB" stroke="#5B3FA5" stroke-width="1.2"/>
<text x="340" y="92" font-size="14" font-weight="500" fill="#3D2680" text-anchor="middle">AI SDLC Master · 多 Agent 总编排器</text>
<text x="340" y="110" font-size="11" fill="#5b6b85" text-anchor="middle">state.json 持久记忆 · 跨会话自动续跑</text>

<!-- master -> phases -->
<path d="M340 118 L130 148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 118 L370 148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 118 L580 148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- PRD -->
<rect x="40" y="148" width="180" height="118" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="130" y="172" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">PRD 流水线</text>
<text x="130" y="194" font-size="12" fill="#5b6b85" text-anchor="middle">prd-master 编排</text>
<text x="130" y="214" font-size="12" fill="#5b6b85" text-anchor="middle">拷问→故事→大纲</text>
<text x="130" y="234" font-size="12" fill="#5b6b85" text-anchor="middle">→PRD→原型</text>
<text x="130" y="254" font-size="11" fill="#888780" text-anchor="middle">产物 01~05 文件</text>

<!-- gate PRD->DEV -->
<path d="M250 205 L272 207 L250 209 L228 207 Z" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="250" y="224" font-size="9" fill="#791F1F" text-anchor="middle">闸门</text>

<!-- DEV -->
<rect x="280" y="148" width="180" height="118" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="370" y="172" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">受治理开发</text>
<text x="370" y="194" font-size="12" fill="#5b6b85" text-anchor="middle">dev-harness 门禁</text>
<text x="370" y="214" font-size="12" fill="#5b6b85" text-anchor="middle">G1自检 G2范围</text>
<text x="370" y="234" font-size="12" fill="#5b6b85" text-anchor="middle">G3置信 G4还原 G5清洁</text>
<text x="370" y="254" font-size="11" fill="#888780" text-anchor="middle">产出 4 份报告</text>

<!-- gate DEV->QA -->
<path d="M490 205 L512 207 L490 209 L468 207 Z" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="490" y="224" font-size="9" fill="#791F1F" text-anchor="middle">闸门</text>

<!-- QA -->
<rect x="520" y="148" width="120" height="118" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="580" y="172" font-size="14" font-weight="500" fill="#633806" text-anchor="middle">QA 流水线</text>
<text x="580" y="194" font-size="11" fill="#5b6b85" text-anchor="middle">qa-master 编排</text>
<text x="580" y="212" font-size="11" fill="#5b6b85" text-anchor="middle">提取→设计</text>
<text x="580" y="230" font-size="11" fill="#5b6b85" text-anchor="middle">→用例→分类→执行</text>
<text x="580" y="250" font-size="10" fill="#888780" text-anchor="middle">含 Python 工具链</text>

<!-- arrows between phases -->
<path d="M220 207 L226 207" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M274 207 L278 207" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M460 207 L466 207" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M514 207 L518 207" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- feedback loop -->
<path d="M580 266 C 580 350, 130 350, 130 268" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="355" y="350" font-size="11" fill="#64748b" text-anchor="middle">反馈闭环：下游变更回填上游（反漂移铁律）</text>

<!-- runtime bar -->
<rect x="40" y="382" width="600" height="32" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="402" font-size="11" fill="#444441" text-anchor="middle">运行底座：WorkBuddy Skill / Agent 运行时 · 唯一可运行环境</text>
</svg>
